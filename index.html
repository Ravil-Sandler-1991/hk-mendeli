<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#1a1a1a;background:#f5f5f0;min-height:100vh;-webkit-user-select:none;user-select:none}

#app{max-width:700px;margin:0 auto;padding:12px;height:100vh;overflow-y:auto}
h3{font-size:16px;font-weight:600}
.header{background:#fff;border-radius:12px;border:0.5px solid #e0dfd8;padding:13px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.header-title{font-size:16px;font-weight:700;color:#1a1a1a}
.header-sub{font-size:11px;color:#aaa;margin-top:2px}

.lang-switcher{display:flex;gap:4px;margin-left:auto}

.tabs{display:flex;border-bottom:0.5px solid #e0dfd8;background:#fff;border-radius:12px 12px 0 0;padding:0 4px}
.tab{padding:11px 16px;cursor:pointer;font-size:14px;font-weight:500;color:#aaa;border-bottom:2px solid transparent;margin-bottom:-0.5px;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap}

.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:500}
.badge-sup{background:#E6F1FB;color:#0C447C}
.badge-dlx{background:#EEEDFE;color:#3C3489}
.badge-suite{background:#FAEEDA;color:#633806}
.badge-loft{background:#EAF3DE;color:#27500A}
.badge-premdlx{background:#FBEAF0;color:#72243E}
.badge-classic{background:#F1EFE8;color:#444441}
.badge-other{background:#EDEAF7;color:#4B3F8C}
.badge-urgent{background:#FCEBEB;color:#A32D2D;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}

.room-card.has-notes{border-color:#EF9F27}
.room-card .num{font-size:14px;font-weight:600;margin-bottom:3px}
.floor-label{font-size:11px;font-weight:700;color:#aaa;margin:1rem 0 0.4rem;text-transform:uppercase;letter-spacing:0.07em}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100}

.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.1rem}
.close-btn{background:none;border:none;cursor:pointer;font-size:22px;color:#aaa;padding:4px;line-height:1}
.btn{padding:10px 18px;border-radius:10px;border:0.5px solid #ddd;cursor:pointer;font-size:14px;font-weight:500;background:#fff;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:0.75}
.btn-primary{background:#185FA5;border-color:#185FA5;color:#fff}
.btn-danger{background:#A32D2D;border-color:#A32D2D;color:#fff}
.btn-success{background:#3B6D11;border-color:#3B6D11;color:#fff}
.btn-clean{background:#3B6D11;border-color:#3B6D11;color:#fff;width:100%;padding:14px;font-size:16px;border-radius:12px;margin-bottom:12px}

.ticket-card{border:0.5px solid #e0dfd8;border-radius:10px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ticket-card:active{opacity:0.8}
.ticket-card.open{border-left:3px solid #E24B4A}
.ticket-card.open.urgent{border-left:4px solid #A32D2D;background:#fffafa}
.ticket-card.resolved{border-left:3px solid #639922;opacity:0.65}
textarea,select,input[type=text],input[type=password],input[type=date]{width:100%;border:0.5px solid #ccc;border-radius:10px;padding:11px;font-size:15px;font-family:inherit;background:#fff;color:#1a1a1a;outline:none;-webkit-appearance:none}
textarea{resize:vertical;line-height:1.6}
textarea:focus,select:focus,input:focus{border-color:#185FA5}
.pin-input{width:160px;text-align:center;font-size:26px;letter-spacing:8px;font-family:monospace}
.stat-card{background:#f5f5f0;border-radius:10px;padding:12px;text-align:center}
.stat-num{font-size:28px;font-weight:700}
.stat-lbl{font-size:11px;color:#888;margin-top:3px}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:1rem}
.filter-btn{padding:6px 14px;border-radius:20px;border:0.5px solid #ddd;cursor:pointer;font-size:13px;background:#fff;color:#888}
.filter-btn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:0.9rem}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#888}
.section-card{background:#fff;border-radius:12px;border:0.5px solid #e0dfd8;margin-bottom:14px}
.hidden{display:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.sync-indicator{font-size:11px;color:#aaa;display:flex;align-items:center;gap:4px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#639922;flex-shrink:0}
.sync-dot.syncing{background:#EF9F27;animation:pulse 1s infinite}
.sync-dot.error{background:#E24B4A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.field-group{margin-bottom:1rem}
.field-label{font-size:13px;color:#888;display:block;margin-bottom:6px}
.note-item{padding:10px 12px;background:#f9f8f4;border-radius:8px;margin-bottom:8px;border:0.5px solid #e8e7e0}
.note-text{font-size:14px;line-height:1.5;margin-bottom:4px}
.note-meta{font-size:11px;color:#aaa}
.note-translate{background:none;border:none;cursor:pointer;color:#185FA5;font-size:12px;padding:0;margin-left:8px}
.note-translation{font-size:13px;color:#185FA5;background:#E6F1FB;border-radius:6px;padding:6px 10px;margin-top:6px;line-height:1.5;display:none}
.clean-status{text-align:center;padding:16px 0 8px;margin-bottom:4px}
.clean-icon{font-size:48px;margin-bottom:8px}
.clean-label{font-size:15px;font-weight:600;color:#3B6D11}
.dirty-label{font-size:15px;font-weight:600;color:#888}
.notes-section{margin-top:4px}
.notes-header{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:10px}
.add-note-row{display:flex;gap:8px;margin-top:10px}
.add-note-row textarea{flex:1;min-height:44px;padding:10px}
.user-chip{background:#E6F1FB;color:#0C447C;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500}
.priority-row{display:flex;gap:8px;margin-bottom:1rem}
.priority-btn{flex:1;padding:10px;border-radius:10px;border:0.5px solid #ddd;cursor:pointer;font-size:14px;font-weight:600;text-align:center;background:#fff;-webkit-tap-highlight-color:transparent}
.priority-btn.selected{background:#E8E8E8;color:#1a1a1a;border-color:#D0D0D0}
.priority-btn.urgent{border-color:#A32D2D;color:#A32D2D}
.priority-btn.urgent.selected{background:#A32D2D;color:#fff}
.priority-btn.normal{border-color:#8A5A00;color:#8A5A00}
.priority-btn.normal.selected{background:#EF9F27;color:#fff;border-color:#EF9F27}
.eta-section{background:#f9f8f4;border-radius:12px;padding:14px;margin-top:1rem;border:0.5px solid #e8e7e0}
.eta-title{font-size:13px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}
.eta-btn{width:100%;padding:12px;border-radius:10px;border:0.5px solid #ddd;cursor:pointer;font-size:14px;font-weight:500;text-align:left;background:#fff;margin-bottom:8px;display:flex;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.eta-btn.selected{background:#185FA5;border-color:#185FA5;color:#fff}
.eta-btn:active{opacity:0.75}
.urgent-banner{background:#FCEBEB;border:0.5px solid #E24B4A;border-radius:10px;padding:10px 14px;margin-bottom:1rem;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#A32D2D}

/* ===== ENHANCED CHAT SYSTEM STYLES ===== */

/* FLOATING CHAT BUBBLE */
.chat-bubble {
  position: fixed;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #185FA5 0%, #0d3f7a 100%);
  color: #fff;
  border: none;
  cursor: grab;
  z-index: 9999;
  box-shadow: 0 4px 16px rgba(24, 95, 165, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  bottom: 20px;
  right: 20px;
  transition: all 0.2s ease;
}

.chat-bubble:hover {
  box-shadow: 0 6px 20px rgba(24, 95, 165, 0.5);
  transform: scale(1.05);
}

.chat-bubble:active {
  cursor: grabbing;
}

.chat-bubble.dragging {
  box-shadow: 0 8px 24px rgba(24, 95, 165, 0.6);
  z-index: 10001;
}

/* Unread badge */
.chat-bubble .unread-badge {
  position: absolute;
  top: -8px;
  right: -8px;
  background: #E24B4A;
  color: #fff;
  border-radius: 50%;
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  border: 2px solid #fff;
  box-shadow: 0 2px 8px rgba(226, 75, 74, 0.4);
}

.chat-bubble .unread-badge.hidden {
  display: none;
}

/* CHAT WINDOW */
.chat-window {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: min(100vw - 20px, 420px);
  height: 580px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 5px 50px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  z-index: 10000;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.8) translateY(20px);
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.chat-window.open {
  opacity: 1;
  transform: scale(1) translateY(0);
  pointer-events: all;
}

@media (max-width: 480px) {
  .chat-window {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border-radius: 0;
    bottom: auto;
    right: auto;
  }
}

/* Chat Header */
.chat-header {
  background: linear-gradient(135deg, #185FA5 0%, #0d3f7a 100%);
  color: #fff;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(0, 0, 0, 0.1);
  flex-shrink: 0;
}

.chat-header-title {
  font-size: 16px;
  font-weight: 700;
}

.chat-header-sub {
  font-size: 12px;
  opacity: 0.9;
  margin-top: 2px;
}

.chat-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  padding: 4px 8px;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}

/* Channel Tabs */
.chat-channels {
  display: flex;
  gap: 0;
  border-bottom: 1px solid #e0dfd8;
  background: #fff;
  overflow-x: auto;
  flex-shrink: 0;
}

.chat-channel {
  flex: 1;
  min-width: 100px;
  padding: 12px 14px;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: #aaa;
  border-bottom: 2px solid transparent;
  background: #fff;
  border: none;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}

.chat-channel.active {
  color: #185FA5;
  border-bottom-color: #185FA5;
}

.chat-channel-badge {
  display: inline-block;
  background: #E24B4A;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 5px;
  border-radius: 4px;
  margin-left: 4px;
}

/* Messages Container */
.chat-messages {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px;
  background: #fff;
  display: flex;
  flex-direction: column;
  gap: 8px;
  -webkit-overflow-scrolling: touch;
}

/* Message Group - Date Separator */
.message-date-separator {
  text-align: center;
  margin: 16px 0 12px;
  position: relative;
}

.message-date-separator::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 1px;
  background: #e0dfd8;
  z-index: 1;
}

.message-date-text {
  background: #fff;
  color: #aaa;
  font-size: 11px;
  font-weight: 600;
  padding: 0 10px;
  position: relative;
  z-index: 2;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* Message Bubble */
.message {
  display: flex;
  gap: 8px;
  margin-bottom: 4px;
  animation: slideInMessage 0.3s ease-out;
}

@keyframes slideInMessage {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.message.own {
  justify-content: flex-end;
}

.message-content {
  max-width: 75%;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.message.own .message-content {
  align-items: flex-end;
}

.message-sender {
  font-size: 11px;
  font-weight: 600;
  color: #888;
  margin-bottom: 2px;
  padding: 0 8px;
}

.message.own .message-sender {
  color: #0d3f7a;
}

.message-text {
  background: #e8e8e8;
  color: #1a1a1a;
  padding: 8px 12px;
  border-radius: 12px;
  word-wrap: break-word;
  line-height: 1.4;
  font-size: 14px;
}

.message.own .message-text {
  background: #185FA5;
  color: #fff;
  border-radius: 12px 4px 12px 12px;
}

.message:not(.own) .message-text {
  border-radius: 4px 12px 12px 12px;
}

.message-time {
  font-size: 11px;
  color: #aaa;
  padding: 0 8px;
  margin-top: 2px;
}

.message.own .message-time {
  color: #0d6bad;
}

/* Typing Indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 12px;
  background: #f0f0f0;
  border-radius: 12px;
  width: fit-content;
  margin: 4px 0;
}

.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #999;
  animation: typingAnimation 1.4s infinite;
}

.typing-dot:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-dot:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes typingAnimation {
  0%, 60%, 100% {
    opacity: 0.5;
    transform: translateY(0);
  }
  30% {
    opacity: 1;
    transform: translateY(-8px);
  }
}

.typing-text {
  font-size: 12px;
  color: #888;
  margin-left: 4px;
}

/* Input Area - CRITICAL FOR MOBILE */
.chat-input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #fff;
  border-top: 1px solid #e0dfd8;
  flex-shrink: 0;
  align-items: flex-end;
}

.chat-input {
  flex: 1;
  border: 0.5px solid #ddd;
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 14px;
  font-family: inherit;
  background: #f9f9f9;
  color: #1a1a1a;
  outline: none;
  -webkit-appearance: none;
  resize: none;
  max-height: 100px;
  min-height: 40px;
  line-height: 1.4;
}

.chat-input:focus {
  border-color: #185FA5;
  background: #fff;
}

@supports (padding: max(0px)) {
  .chat-input-area {
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
}

.chat-send {
  background: #185FA5;
  border: none;
  color: #fff;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.2s ease;
}

.chat-send:active {
  transform: scale(0.92);
  background: #0d3f7a;
}

/* Empty State */
.chat-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #aaa;
  text-align: center;
  padding: 20px;
}

.chat-empty-icon {
  font-size: 48px;
  margin-bottom: 12px;
  opacity: 0.5;
}

.chat-empty-text {
  font-size: 14px;
  line-height: 1.5;
}

/* Online Status Indicator */
.online-status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: #639922;
  font-weight: 500;
}

.online-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #639922;
}

/* Responsive Adjustments */
@media (max-width: 480px) {
  .chat-bubble {
    bottom: 16px;
    right: 16px;
    width: 50px;
    height: 50px;
    font-size: 20px;
  }
  
  .message-content {
    max-width: 85%;
  }
  
  .chat-input {
    font-size: 16px;
  }
}

/* Scrollbar Styling */
.chat-messages::-webkit-scrollbar {
  width: 4px;
}

.chat-messages::-webkit-scrollbar-track {
  background: transparent;
}

.chat-messages::-webkit-scrollbar-thumb {
  background: #ddd;
  border-radius: 2px;
}

.chat-messages::-webkit-scrollbar-thumb:hover {
  background: #ccc;
}
</style>
</head>
<body>
<div id="app"></div>

<!-- FLOATING CHAT BUBBLE -->
<button id="chatBubble" class="chat-bubble" onclick="toggleChat()" title="Open Team Chat">
  💬
  <div class="unread-badge hidden">0</div>
</button>

<!-- CHAT WINDOW -->
<div id="chatWindow" class="chat-window">
  <!-- Header -->
  <div class="chat-header">
    <div>
      <div class="chat-header-title">Team Chat</div>
      <div class="chat-header-sub" id="onlineStatus">
        <span class="online-dot"></span> 0 online
      </div>
    </div>
    <button class="chat-close" onclick="toggleChat()" title="Close chat">✕</button>
  </div>

  <!-- Channel Tabs -->
  <div class="chat-channels">
    <button class="chat-channel active" data-channel="reception" onclick="switchChannel('reception')">
      🚪 Reception
      <span class="chat-channel-badge hidden">0</span>
    </button>
    <button class="chat-channel" data-channel="hk" onclick="switchChannel('hk')">
      🧹 HK
      <span class="chat-channel-badge hidden">0</span>
    </button>
    <button class="chat-channel" data-channel="maintenance" onclick="switchChannel('maintenance')">
      🔧 Maintenance
      <span class="chat-channel-badge hidden">0</span>
    </button>
  </div>

  <!-- Messages -->
  <div id="chatMessages" class="chat-messages"></div>

  <!-- Input Area -->
  <div class="chat-input-area">
    <input 
      id="chatInput" 
      class="chat-input" 
      type="text" 
      placeholder="Type message..."
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >
    <button class="chat-send" onclick="sendChatMessage()" title="Send message">→</button>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const SUPA_URL = 'https://tpfqcfnaynccdoxstvhz.supabase.co';
const SUPA_KEY = 'sb_publishable_eoQs4On3S-GmFWhBxlrcbQ_4Q-vzEax';

// ===== GLOBAL STATE =====
let currentUser = localStorage.getItem('currentUser') || 'Staff-' + Math.random().toString(36).substr(2, 9);
let currentChannel = 'reception';
let chatState = {
  isDragging: false,
  dragOffset: { x: 0, y: 0 },
  messages: {},
  unread: {},
  typingUsers: {},
  onlineUsers: [],
  lastMessageTime: {}
};

// ===== INITIALIZATION =====
document.addEventListener('DOMContentLoaded', function() {
  console.log('💬 Chat System Initializing...');
  
  // Save current user
  localStorage.setItem('currentUser', currentUser);
  console.log('👤 Current user:', currentUser);
  
  // Request notification permission
  requestNotificationPermission().then(result => {
    if(result === 'granted') {
      registerServiceWorker();
    }
  }).catch(err => console.log('Permission error:', err));
  
  // Initialize chat
  initializeChat();
  
  // Setup event listeners
  setupEventListeners();
  
  // Start polling
  startChatPolling();
});

// ===== CHAT INITIALIZATION =====
function initializeChat() {
  // Initialize message storage for each channel
  ['reception', 'hk', 'maintenance'].forEach(channel => {
    chatState.messages[channel] = [];
    chatState.unread[channel] = 0;
    chatState.typingUsers[channel] = [];
  });
  
  // Load saved bubble position
  loadBubblePosition();
  
  // Load messages
  loadMessages();
  
  // Setup draggable bubble
  initDraggable();
}

// ===== EVENT LISTENERS =====
function setupEventListeners() {
  const input = document.getElementById('chatInput');
  
  input.addEventListener('keypress', function(e) {
    if(e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendChatMessage();
    }
  });
  
  input.addEventListener('input', function() {
    // Auto-resize textarea
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 100) + 'px';
  });
  
  // Focus management
  input.addEventListener('focus', function() {
    setTimeout(() => {
      document.getElementById('chatMessages').scrollTop = 
        document.getElementById('chatMessages').scrollHeight;
    }, 100);
  });
}

// ===== CHANNEL SWITCHING =====
function switchChannel(channel) {
  currentChannel = channel;
  
  // Update active tab
  document.querySelectorAll('.chat-channel').forEach(btn => {
    btn.classList.remove('active');
  });
  document.querySelector(`[data-channel="${channel}"]`).classList.add('active');
  
  // Clear unread badge
  chatState.unread[channel] = 0;
  updateUnreadBadges();
  
  // Reload messages
  loadMessages();
}

// ===== LOAD MESSAGES =====
function loadMessages() {
  const messagesEl = document.getElementById('chatMessages');
  const messages = chatState.messages[currentChannel] || [];
  
  if(messages.length === 0) {
    messagesEl.innerHTML = `
      <div class="chat-empty">
        <div class="chat-empty-icon">💭</div>
        <div class="chat-empty-text">No messages yet<br>Start a conversation!</div>
      </div>
    `;
    return;
  }
  
  let html = '';
  let lastDate = null;
  
  messages.forEach((msg, idx) => {
    const msgDate = formatMessageDate(msg.created_at);
    const dateGroup = getDateGroup(msg.created_at);
    
    // Add date separator
    if(lastDate !== dateGroup) {
      html += `<div class="message-date-separator">
        <span class="message-date-text">${dateGroup}</span>
      </div>`;
      lastDate = dateGroup;
    }
    
    const isOwn = msg.sender === currentUser;
    const time = formatTime(msg.created_at);
    
    html += `
      <div class="message ${isOwn ? 'own' : ''}">
        <div class="message-content">
          <div class="message-sender">${msg.sender}</div>
          <div class="message-text">${escapeHtml(msg.message)}</div>
          <div class="message-time">${time}</div>
        </div>
      </div>
    `;
  });
  
  messagesEl.innerHTML = html;
  
  // Auto-scroll to bottom
  setTimeout(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 50);
}

// ===== FORMAT HELPERS =====
function getDateGroup(timestamp) {
  const msgDate = new Date(timestamp);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  
  if(isSameDay(msgDate, today)) {
    return 'Today';
  } else if(isSameDay(msgDate, yesterday)) {
    return 'Yesterday';
  } else {
    return msgDate.toLocaleDateString('he-IL', { month: 'short', day: 'numeric' });
  }
}

function isSameDay(date1, date2) {
  return date1.getFullYear() === date2.getFullYear() &&
         date1.getMonth() === date2.getMonth() &&
         date1.getDate() === date2.getDate();
}

function formatTime(timestamp) {
  const date = new Date(timestamp);
  return date.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
}

function formatMessageDate(timestamp) {
  return new Date(timestamp).toLocaleDateString('he-IL');
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ===== SEND MESSAGE =====
function sendChatMessage() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  
  if(!msg) return;
  
  input.value = '';
  input.style.height = 'auto';
  
  const payload = {
    sender: currentUser,
    channel: currentChannel,
    message: msg,
    created_at: new Date().toISOString()
  };
  
  fetch(SUPA_URL + '/rest/v1/chat_messages', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + SUPA_KEY,
      'apikey': SUPA_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  }).then(res => {
    if(res.ok) {
      setTimeout(() => {
        loadMessages();
        playNotificationSound();
      }, 300);
    }
  }).catch(e => console.error('Send error:', e));
}

// ===== POLLING =====
function startChatPolling() {
  loadMessages();
  loadOnlineStatus();
  
  setInterval(() => {
    if(!chatState.isDragging) {
      loadMessages();
      loadOnlineStatus();
    }
  }, 2000);
}

// ===== LOAD MESSAGES FROM SUPABASE =====
function loadMessages() {
  const url = SUPA_URL + '/rest/v1/chat_messages?channel=eq.' + currentChannel + '&order=created_at.asc';
  
  fetch(url, {
    headers: {
      'Authorization': 'Bearer ' + SUPA_KEY,
      'apikey': SUPA_KEY
    }
  })
  .then(res => res.json())
  .then(messages => {
    const oldCount = (chatState.messages[currentChannel] || []).length;
    chatState.messages[currentChannel] = messages;
    
    // Update unread for other channels
    ['reception', 'hk', 'maintenance'].forEach(channel => {
      if(channel !== currentChannel) {
        const channelMessages = messages.filter(m => m.channel === channel);
        const unreadCount = channelMessages.filter(m => m.sender !== currentUser && !m.seen).length;
        chatState.unread[channel] = unreadCount;
      }
    });
    
    // Play sound if new messages
    if(messages.length > oldCount) {
      const newMessages = messages.slice(-3);
      newMessages.forEach(msg => {
        if(msg.sender !== currentUser) {
          playNotificationSound();
        }
      });
    }
    
    // Render if current channel
    if(chatState.messages[currentChannel]) {
      renderMessages();
    }
    
    updateUnreadBadges();
  })
  .catch(e => console.error('Load error:', e));
}

function renderMessages() {
  const messagesEl = document.getElementById('chatMessages');
  const messages = chatState.messages[currentChannel] || [];
  
  if(messages.length === 0) {
    messagesEl.innerHTML = `
      <div class="chat-empty">
        <div class="chat-empty-icon">💭</div>
        <div class="chat-empty-text">No messages yet<br>Start a conversation!</div>
      </div>
    `;
    return;
  }
  
  let html = '';
  let lastDate = null;
  
  messages.forEach((msg) => {
    const dateGroup = getDateGroup(msg.created_at);
    const isOwn = msg.sender === currentUser;
    const time = formatTime(msg.created_at);
    
    // Add date separator
    if(lastDate !== dateGroup) {
      html += `<div class="message-date-separator">
        <span class="message-date-text">${dateGroup}</span>
      </div>`;
      lastDate = dateGroup;
    }
    
    html += `
      <div class="message ${isOwn ? 'own' : ''}">
        <div class="message-content">
          <div class="message-sender">${escapeHtml(msg.sender)}</div>
          <div class="message-text">${escapeHtml(msg.message)}</div>
          <div class="message-time">${time}</div>
        </div>
      </div>
    `;
  });
  
  messagesEl.innerHTML = html;
  
  setTimeout(() => {
    const messagesContainer = document.getElementById('chatMessages');
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
  }, 50);
}

// ===== ONLINE STATUS =====
function loadOnlineStatus() {
  fetch(SUPA_URL + '/rest/v1/chat_users_online?select=*', {
    headers: {
      'Authorization': 'Bearer ' + SUPA_KEY,
      'apikey': SUPA_KEY
    }
  })
  .then(res => res.json())
  .then(users => {
    const onlineCount = users.filter(u => {
      const lastSeen = new Date(u.last_seen);
      const now = new Date();
      return (now - lastSeen) < 30000; // 30 seconds
    }).length;
    
    const statusEl = document.getElementById('onlineStatus');
    if(statusEl) {
      statusEl.innerHTML = `
        <span class="online-dot"></span> ${onlineCount} online
      `;
    }
    
    // Update current user status
    updateUserStatus();
  })
  .catch(e => console.error('Online status error:', e));
}

function updateUserStatus() {
  fetch(SUPA_URL + '/rest/v1/chat_users_online', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + SUPA_KEY,
      'apikey': SUPA_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      username: currentUser,
      last_seen: new Date().toISOString()
    })
  }).catch(e => console.error('Status update error:', e));
}

// ===== UNREAD BADGES =====
function updateUnreadBadges() {
  let totalUnread = 0;
  
  ['reception', 'hk', 'maintenance'].forEach(channel => {
    const count = chatState.unread[channel] || 0;
    const badge = document.querySelector(`[data-channel="${channel}"] .chat-channel-badge`);
    
    if(count > 0) {
      badge.textContent = count > 9 ? '9+' : count;
      badge.classList.remove('hidden');
      totalUnread += count;
    } else {
      badge.classList.add('hidden');
    }
  });
  
  const bubble = document.getElementById('chatBubble').querySelector('.unread-badge');
  if(totalUnread > 0) {
    bubble.textContent = totalUnread > 9 ? '9+' : totalUnread;
    bubble.classList.remove('hidden');
  } else {
    bubble.classList.add('hidden');
  }
}

// ===== NOTIFICATIONS =====
async function requestNotificationPermission() {
  if(!('Notification' in window)) {
    console.log('Notifications not supported');
    return 'denied';
  }
  
  if(Notification.permission === 'granted') {
    return 'granted';
  }
  
  if(Notification.permission !== 'denied') {
    const permission = await Notification.requestPermission();
    return permission;
  }
  
  return 'denied';
}

function registerServiceWorker() {
  if('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js')
      .then(reg => console.log('✅ Service Worker registered'))
      .catch(err => console.log('Service Worker error:', err));
  }
}

function playNotificationSound() {
  // System notification
  if(Notification.permission === 'granted') {
    const msg = (chatState.messages[currentChannel] || []).pop();
    if(msg && msg.sender !== currentUser) {
      new Notification('💬 New Message', {
        body: `${msg.sender}: ${msg.message.substring(0, 40)}`,
        icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="%23185FA5" width="100" height="100"/><text x="50" y="70" font-size="60" fill="white" text-anchor="middle">💬</text></svg>',
        badge: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%23E24B4A"/></svg>'
      });
    }
  }
  
  // Audio notification
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(!AudioContext) return;
    
    const ctx = new AudioContext();
    if(ctx.state === 'suspended') {
      ctx.resume();
    }
    
    const t = ctx.currentTime;
    const notes = [
      { f: 800, s: 0, d: 0.1 },
      { f: 800, s: 0.12, d: 0.1 },
      { f: 600, s: 0.24, d: 0.15 },
      { f: 800, s: 0.42, d: 0.1 },
      { f: 500, s: 0.54, d: 0.25 }
    ];
    
    notes.forEach(n => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.frequency.setValueAtTime(n.f, t + n.s);
      o.type = 'sine';
      g.gain.setValueAtTime(0.3, t + n.s);
      g.gain.exponentialRampToValueAtTime(0.01, t + n.s + n.d);
      o.start(t + n.s);
      o.stop(t + n.s + n.d);
    });
  } catch(e) {
    console.log('Audio error:', e);
  }
}

// ===== CHAT UI TOGGLE =====
function toggleChat() {
  const chatWindow = document.getElementById('chatWindow');
  const bubble = document.getElementById('chatBubble');
  
  chatWindow.classList.toggle('open');
  
  if(chatWindow.classList.contains('open')) {
    document.getElementById('chatInput').focus();
    setTimeout(() => {
      const messagesContainer = document.getElementById('chatMessages');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }, 300);
  }
}

// ===== DRAGGABLE BUBBLE =====
function initDraggable() {
  const bubble = document.getElementById('chatBubble');
  let startX = 0;
  let startY = 0;
  let startLeft = bubble.offsetLeft;
  let startTop = bubble.offsetTop;
  
  bubble.addEventListener('mousedown', startDrag);
  bubble.addEventListener('touchstart', startDrag, { passive: false });
  
  function startDrag(e) {
    if(e.type.includes('touch')) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    } else {
      startX = e.clientX;
      startY = e.clientY;
    }
    
    startLeft = bubble.offsetLeft;
    startTop = bubble.offsetTop;
    
    chatState.isDragging = true;
    bubble.classList.add('dragging');
    
    document.addEventListener('mousemove', drag);
    document.addEventListener('touchmove', drag, { passive: false });
    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
  }
  
  function drag(e) {
    e.preventDefault && e.preventDefault();
    
    let currentX, currentY;
    if(e.type.includes('touch')) {
      currentX = e.touches[0].clientX;
      currentY = e.touches[0].clientY;
    } else {
      currentX = e.clientX;
      currentY = e.clientY;
    }
    
    const diffX = currentX - startX;
    const diffY = currentY - startY;
    
    const newLeft = Math.max(0, Math.min(window.innerWidth - 56, startLeft + diffX));
    const newTop = Math.max(0, Math.min(window.innerHeight - 56, startTop + diffY));
    
    bubble.style.left = newLeft + 'px';
    bubble.style.top = newTop + 'px';
    bubble.style.right = 'auto';
    bubble.style.bottom = 'auto';
  }
  
  function endDrag() {
    chatState.isDragging = false;
    bubble.classList.remove('dragging');
    
    // Save position
    saveBubblePosition(bubble.offsetLeft, bubble.offsetTop);
    
    document.removeEventListener('mousemove', drag);
    document.removeEventListener('touchmove', drag);
    document.removeEventListener('mouseup', endDrag);
    document.removeEventListener('touchend', endDrag);
  }
}

function saveBubblePosition(x, y) {
  localStorage.setItem('chatBubblePos', JSON.stringify({ x, y }));
}

function loadBubblePosition() {
  const bubble = document.getElementById('chatBubble');
  const saved = localStorage.getItem('chatBubblePos');
  
  if(saved) {
    const pos = JSON.parse(saved);
    bubble.style.left = pos.x + 'px';
    bubble.style.top = pos.y + 'px';
    bubble.style.right = 'auto';
    bubble.style.bottom = 'auto';
  }
}

console.log('✅ Chat system loaded!');

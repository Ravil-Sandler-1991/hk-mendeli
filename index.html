/* ENHANCED CHAT STYLES - FLOATING BUBBLE */
.chat-bubble {
  position: fixed;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, #185FA5 0%, #0d3f7a 100%);
  color: #fff;
  border: none;
  cursor: grab;
  z-index: 9999;
  box-shadow: 0 4px 12px rgba(24, 95, 165, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  transition: box-shadow 0.2s ease;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  bottom: 20px;
  right: 20px;
}

.chat-bubble:hover {
  box-shadow: 0 6px 16px rgba(24, 95, 165, 0.4);
}

.chat-bubble:active {
  cursor: grabbing;
}

.chat-bubble.dragging {
  box-shadow: 0 8px 20px rgba(24, 95, 165, 0.5);
}

/* Unread badge */
.chat-bubble .unread-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #E24B4A;
  color: #fff;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  border: 2px solid #fff;
  box-shadow: 0 2px 4px rgba(226, 75, 74, 0.3);
}

.chat-bubble .unread-badge.hidden {
  display: none;
}

.chat-window {
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 340px;
  height: 480px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
  display: flex;
  flex-direction: column;
  z-index: 9999;
  overflow: hidden;
  opacity: 0;
  transform: scale(0.8);
  pointer-events: none;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.chat-window.visible {
  opacity: 1;
  transform: scale(1);
  pointer-events: all;
}

/* Mobile optimization */

  .chat-window {
    width: calc(100vw - 24px);
    height: calc(100vh - 100px);
    bottom: 70px;
    right: 12px;
    left: 12px;

<script>
// Essential config - replace with your actual values
const SUPA_URL = 'https://your-supabase-url.supabase.co';
const SUPA_KEY = 'your-anon-key';
let currentUser = 'User-' + Math.random().toString(36).substr(2, 9);

// CHAT STATE
const chatState = {
  isOpen: false,
  messages: [],
  unreadCount: 0,
  bubblePos: { x: 0, y: 0 },
  isDragging: false,
  dragOffset: { x: 0, y: 0 }
};

// LOAD SAVED STATE
function loadChatState() {
  try {
    const saved = localStorage.getItem('hotelChatState');
    if(saved) {
      const state = JSON.parse(saved);
      chatState.bubblePos = state.bubblePos || { x: 0, y: 0 };
      chatState.unreadCount = state.unreadCount || 0;
    }
  } catch(e) {
    console.log('Could not load chat state');
  }
  applyBubblePosition();
}

// SAVE STATE
function saveChatState() {
  try {
    localStorage.setItem('hotelChatState', JSON.stringify({
      bubblePos: chatState.bubblePos,
      unreadCount: chatState.unreadCount
    }));
  } catch(e) {
    console.log('Could not save chat state');
  }
}

// BUBBLE POSITIONING
function applyBubblePosition() {
  const bubble = document.getElementById('chatBubble');
  if(!bubble) return;
  const { x, y } = chatState.bubblePos;
  if(x !== 0 || y !== 0) {
    bubble.style.right = 'auto';
    bubble.style.bottom = 'auto';
    bubble.style.left = x + 'px';
    bubble.style.top = y + 'px';
  }
}

// DRAGGABLE BUBBLE
function initDraggable() {
  const bubble = document.getElementById('chatBubble');
  if(!bubble) return;

  let startX, startY, initialX, initialY;

  function handleStart(e) {
    chatState.isDragging = true;
    bubble.classList.add('dragging');
    
    const touch = e.touches ? e.touches[0] : e;
    startX = touch.clientX;
    startY = touch.clientY;
    
    const rect = bubble.getBoundingClientRect();
    initialX = rect.left;
    initialY = rect.top;
  }

  function handleMove(e) {
    if(!chatState.isDragging) return;
    e.preventDefault();
    
    const touch = e.touches ? e.touches[0] : e;
    const deltaX = touch.clientX - startX;
    const deltaY = touch.clientY - startY;
    
    const newX = initialX + deltaX;
    const newY = initialY + deltaY;
    
    // Constrain to viewport
    const maxX = window.innerWidth - 56;
    const maxY = window.innerHeight - 56;
    
    const constrainedX = Math.max(0, Math.min(newX, maxX));
    const constrainedY = Math.max(0, Math.min(newY, maxY));
    
    bubble.style.left = constrainedX + 'px';
    bubble.style.top = constrainedY + 'px';
    bubble.style.right = 'auto';
    bubble.style.bottom = 'auto';
  }

  function handleEnd() {
    chatState.isDragging = false;
    bubble.classList.remove('dragging');
    
    const rect = bubble.getBoundingClientRect();
    chatState.bubblePos = {
      x: Math.round(rect.left),
      y: Math.round(rect.top)
    };
    saveChatState();
  }

  bubble.addEventListener('mousedown', handleStart);
  bubble.addEventListener('touchstart', handleStart);
  document.addEventListener('mousemove', handleMove);
  document.addEventListener('touchmove', handleMove);
  document.addEventListener('mouseup', handleEnd);
  document.addEventListener('touchend', handleEnd);
}

// TOGGLE CHAT WINDOW
function toggleChatWindow() {
  const window = document.getElementById('chatWindow');
  if(!window) return;
  
  chatState.isOpen = !chatState.isOpen;
  if(chatState.isOpen) {
    window.classList.add('visible');
    loadMessages();
    // Clear unread badge
    chatState.unreadCount = 0;
    updateBadge();
    saveChatState();
  } else {
    window.classList.remove('visible');
  }
}

// UPDATE UNREAD BADGE
function updateBadge() {
  const badge = document.querySelector('.chat-bubble .unread-badge');
  if(!badge) return;
  
  if(chatState.unreadCount > 0) {
    badge.textContent = chatState.unreadCount > 9 ? '9+' : chatState.unreadCount;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
}

// LOAD MESSAGES (General Team Chat)
async function loadMessages() {
  try {
    const url = SUPA_URL + '/rest/v1/chat_messages?order=created_at.asc';
    const res = await fetch(url, {
      headers: {
        'Authorization': 'Bearer ' + SUPA_KEY,
        'apikey': SUPA_KEY
      }
    });
    
    if(!res.ok) return;
    
    const msgs = await res.json();
    chatState.messages = msgs;
    renderMessages();
  } catch(e) {
    console.log('Load error:', e);
  }
}

// RENDER MESSAGES
function renderMessages() {
  const container = document.getElementById('chatMessagesContainer');
  if(!container) return;
  
  if(chatState.messages.length === 0) {
    container.innerHTML = '<div class="chat-empty">👋 No messages yet. Start the conversation!</div>';
    return;
  }
  
  container.innerHTML = chatState.messages.map(msg => {
    const isOwn = msg.sender === currentUser;
    const time = new Date(msg.created_at).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    
    return `
      <div class="chat-message ${isOwn ? 'sent' : 'received'}">
        ${!isOwn ? `<div class="chat-message-sender">${msg.sender}</div>` : ''}
        <div class="chat-message-bubble">${msg.message}</div>
        <div class="chat-message-time">${time}</div>
      </div>
    `;
  }).join('');
  
  container.scrollTop = container.scrollHeight;
}

// SEND MESSAGE
function sendMessage() {
  const input = document.getElementById('chatInput');
  if(!input) return;
  
  const msg = input.value.trim();
  if(!msg) return;
  
  const payload = {
    sender: currentUser,
    message: msg,
    created_at: new Date().toISOString()
  };
  
  fetch(SUPA_URL + '/rest/v1/chat_messages', {
    method: 'POST',
    headers: {
      'Authorization': 'Bearer ' + SUPA_KEY,
      'apikey': SUPA_KEY,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(payload)
  }).then(res => {
    if(res.ok) {
      input.value = '';
      loadMessages();
    }
  }).catch(e => console.log('Send error:', e));
}

// SMART NOTIFICATIONS - Only for messages from OTHERS
function playNotificationSound() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioContext.createOscillator();
    const gain = audioContext.createGain();
    
    osc.connect(gain);
    gain.connect(audioContext.destination);
    
    osc.frequency.setValueAtTime(800, audioContext.currentTime);
    osc.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
    osc.type = 'sine';
    
    gain.gain.setValueAtTime(0.2, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
    
    osc.start(audioContext.currentTime);
    osc.stop(audioContext.currentTime + 0.4);
  } catch(e) {}
}

// POLL FOR NEW MESSAGES
function startPolling() {
  setInterval(() => {
    loadMessages();
  }, 2000);
}

// INIT CHAT ON LOAD
document.addEventListener('DOMContentLoaded', function() {
  loadChatState();
  initDraggable();
  startPolling();
  
  // Enter key to send
  const input = document.getElementById('chatInput');
  if(input) {
    input.addEventListener('keypress', function(e) {
      if(e.key === 'Enter') {
        sendMessage();
      }
    });
  }
});

</script>
</head>
<body>

<div id="app">
  <div class="header">
    <div class="brand-logo">HK</div>
    <div>
      <div class="header-title">HK & Maintenance</div>
      <div class="header-sub">Mendeli | Room Management</div>
    </div>
  </div>
</div>

<!-- FLOATING CHAT BUBBLE -->
<button id="chatBubble" class="chat-bubble" onclick="toggleChatWindow()">
  💬
  <div class="unread-badge hidden">0</div>
</button>

<!-- CHAT WINDOW -->
<div id="chatWindow" class="chat-window">
  <div class="chat-window-header">
    <div class="chat-window-title">💬 Team Chat</div>
    <button class="chat-window-close" onclick="toggleChatWindow()">✕</button>
  </div>
  <div id="chatMessagesContainer" class="chat-messages-container"></div>
  <div class="chat-input-area">
    <input 
      id="chatInput" 
      class="chat-input" 
      type="text" 
      placeholder="Type message..."
      autocomplete="off"
    >
    <button class="chat-send-btn" onclick="sendMessage()">→</button>
  </div>
</div>

</body>
</html>
